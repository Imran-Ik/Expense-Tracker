<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1a73e8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Roboto, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 16px;
      color: #202124;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .status-bar {
      font-size: 13px;
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #e8f0fe;
      color: #1a73e8;
      cursor: pointer;
    }
    .status-bar.offline { background: #fce8e6; color: #c5221f; }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      background: #fff;
      color: #5f6368;
      border: 1px solid #dadce0;
    }
    .tab-btn.active {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }

    .view { display: none; }
    .view.active { display: block; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5f6368;
      margin: 12px 0 4px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #fff;
    }
    input[readonly] { background: #f1f3f4; color: #5f6368; }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    button.primary {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 8px;
    }
    button.primary:active { background: #1558b3; }
    .pending {
      font-size: 13px;
      color: #5f6368;
      margin-top: 10px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      background: #202124;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ---- Summary tab ---- */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: .03em;
      margin: 4px 0 10px;
    }
    .fund-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }
    .fund-card {
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }
    .fund-name {
      font-size: 12px;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
    }
    .fund-balance {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
    }
    .fund-change {
      font-size: 12px;
      margin-top: 4px;
    }
    .fund-change.up { color: #188038; }
    .fund-change.down { color: #c5221f; }
    .fund-change.flat { color: #5f6368; }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: #f1f3f4;
      border-radius: 8px;
    }
    .budget-row { margin-bottom: 14px; }
    .budget-row .labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .budget-row .cat-name { font-weight: 600; }
    .budget-row .amounts { color: #5f6368; }
    .bar-track {
      height: 8px;
      border-radius: 4px;
      background: #e8eaed;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }
    .bar-fill.ok { background: #34a853; }
    .bar-fill.warn { background: #fbbc04; }
    .bar-fill.over { background: #ea4335; }
    .empty-note {
      font-size: 13px;
      color: #5f6368;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h1>Daily Expense Tracker</h1>
  <div id="statusBar" class="status-bar">Checking connection…</div>

  <div class="tabs">
    <button class="tab-btn active" id="tabAddBtn" onclick="switchTab('add')">Add</button>
    <button class="tab-btn" id="tabSummaryBtn" onclick="switchTab('summary')">Summary</button>
  </div>

  <!-- ADD TRANSACTION VIEW -->
  <div id="viewAdd" class="view active">
    <div class="card">
      <div class="row2">
        <div>
          <label>Date</label>
          <input id="date" readonly>
        </div>
        <div>
          <label>Time</label>
          <input id="time" readonly>
        </div>
      </div>

      <label>Amount</label>
      <input id="amount" type="number" inputmode="decimal" placeholder="0.00" step="0.01">

      <label>Txn Type</label>
      <select id="txnType"><option value="">Select…</option></select>

      <div class="row2">
        <div>
          <label>Txn From</label>
          <select id="txnFrom"><option value="">Select…</option></select>
        </div>
        <div>
          <label>Txn To</label>
          <select id="txnTo"><option value="">Select…</option></select>
        </div>
      </div>

      <label>Category</label>
      <select id="category"><option value="">Select…</option></select>

      <label>Remarks</label>
      <input id="remarks" type="text" placeholder="Optional note">

      <button class="primary" id="submitBtn" onclick="submitTxn()">Add Transaction</button>
      <div class="pending" id="pendingCount"></div>
    </div>
  </div>

  <!-- SUMMARY VIEW -->
  <div id="viewSummary" class="view">
    <div class="section-title" id="fundsPeriodLabel">Account Balances</div>
    <div class="fund-grid" id="fundsGrid">
      <div class="empty-note">Loading…</div>
    </div>

    <div class="section-title" id="budgetMonthLabel">Budget vs Actual</div>
    <div class="card" id="budgetCard">
      <div class="empty-note">Loading…</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
