<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Expense Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1a73e8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Roboto, Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 16px;
      color: #202124;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .status-bar {
      font-size: 13px;
      margin-bottom: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #e8f0fe;
      color: #1a73e8;
    }
    .status-bar.offline { background: #fce8e6; color: #c5221f; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #5f6368;
      margin: 12px 0 4px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      background: #fff;
    }
    input[readonly] { background: #f1f3f4; color: #5f6368; }
    .row2 { display: flex; gap: 10px; }
    .row2 > div { flex: 1; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #1a73e8;
      border: none;
      border-radius: 8px;
    }
    button:active { background: #1558b3; }
    .pending {
      font-size: 13px;
      color: #5f6368;
      margin-top: 10px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      background: #202124;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Daily Expense Tracker</h1>
  <div id="statusBar" class="status-bar">Checking connection…</div>

  <div class="card">
    <div class="row2">
      <div>
        <label>Date</label>
        <input id="date" readonly>
      </div>
      <div>
        <label>Time</label>
        <input id="time" readonly>
      </div>
    </div>

    <label>Amount</label>
    <input id="amount" type="number" inputmode="decimal" placeholder="0.00" step="0.01">

    <label>Txn Type</label>
    <select id="txnType"><option value="">Select…</option></select>

    <div class="row2">
      <div>
        <label>Txn From</label>
        <select id="txnFrom"><option value="">Select…</option></select>
      </div>
      <div>
        <label>Txn To</label>
        <select id="txnTo"><option value="">Select…</option></select>
      </div>
    </div>

    <label>Category</label>
    <select id="category"><option value="">Select…</option></select>

    <label>Remarks</label>
    <input id="remarks" type="text" placeholder="Optional note">

    <button id="submitBtn" onclick="submitTxn()">Add Transaction</button>
    <div class="pending" id="pendingCount"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
